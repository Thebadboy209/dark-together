name: Import Unity 2D project
on:
  push:
    paths:
      - ".bootstrap/part-03"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand source archive
        run: |
          cat .bootstrap/part-0{0..3} | base64 --decode > /tmp/dark-together.tar.xz
          echo "cba685bed9b7c03eaa3aa354cf8e61051b1afa8ac847703b57f083979d04ac5e  /tmp/dark-together.tar.xz" | sha256sum --check
          tar -xJf /tmp/dark-together.tar.xz
          cp -a dark-together/. .
          rm -rf dark-together .bootstrap
      - name: Commit imported files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import Unity 2D cross-platform multiplayer starter"
            git push
          fi
